<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Ashes Deck | Board Game Tracker</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/boardgame-diamond-32.png">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/ashes/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="frame site-bar" aria-label="Site navigation">
        <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>Game selection</a>
        <a class="game-home-link" href="/ashes/">Ashes</a>
      </nav>
    </header>
    <main class="frame detail" id="deck-detail">
      <header class="page-header detail-header">
        <h1 id="deck-title">Ashes Deck</h1>
        <p id="deck-message" hidden>The requested deck isn’t in this library.</p>
      </header>
      <div class="detail-layout" id="deck-content" hidden>
        <aside class="deck-summary">
          <div>
            <h2>Phoenixborn</h2>
            <div id="phoenixborn-card"></div>
          </div>
          <div>
            <h2>Dice pool</h2>
            <ul id="dice-pool" class="dice-list"></ul>
          </div>
        </aside>
        <div id="card-lists"></div>
      </div>
      <noscript><p>Enable JavaScript to see the cards in this deck.</p></noscript>
    </main>
  </body>
</html>
